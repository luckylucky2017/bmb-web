# Data lives on the HOST at $DATA_DIR (default: /opt/bmb-vietnam/data), as
# plain bind mounts — not Docker named volumes — so `docker compose down`,
# rebuilding images, or even deleting the containers entirely never touches
# this data; it's just files under /opt you can `ls`, `rsync`, or back up
# directly. Override DATA_DIR in .env only if this deployment's data must
# live somewhere other than /opt/bmb-vietnam/data.
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${DATA_DIR:-/opt/bmb-vietnam/data}/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    ports:
      - "3010:3010"
    volumes:
      - ${DATA_DIR:-/opt/bmb-vietnam/data}/uploads:/app/public/uploads
